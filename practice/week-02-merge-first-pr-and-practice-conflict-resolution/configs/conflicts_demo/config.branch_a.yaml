# ML Project Configuration Matrix (Branch A: feature/model-v2-regularization)

project:
  name: "ml-project-scaffold"
  version: "0.2.0-regularized"
  description: "ML Project with Deep Tree Regularization & High Capacity"
  author: "ML Engineering Team - Modeling Squad"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_samples: 1000
  feature_count: 10
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  target_column: "target"

model:
  name: "RandomForestClassifier"
  type: "tabular_classifier"
  hyperparameters:
    n_estimators: 150
    max_depth: 12
    min_samples_split: 6
    min_samples_leaf: 3
    criterion: "entropy"
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  artifacts_dir: "models/checkpoints"
  model_filename: "model_regularized.joblib"
  metrics_filename: "metrics_regularized.json"

training:
  epochs: 15
  batch_size: 32
  early_stopping_patience: 4
  metrics_to_track:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"

evaluation:
  target_accuracy: 0.90
  target_f1: 0.88
  confusion_matrix_filename: "confusion_matrix.json"
