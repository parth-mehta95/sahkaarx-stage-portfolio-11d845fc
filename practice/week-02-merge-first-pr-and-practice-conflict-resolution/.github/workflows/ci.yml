name: Continuous Integration (ML Conflict Resolution & Tests)

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint & Code Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8

      - name: Run Ruff Linting
        run: |
          ruff check src/ tests/

      - name: Check Code Formatting (Black)
        run: |
          black --check src/ tests/

  test-and-validate:
    name: Unit Tests & Pipeline Validation
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Validate Conflict Resolution Integrity Tests
        run: |
          pytest tests/test_conflict_resolution.py -v

      - name: Validate End-to-End Pipeline (Production Profile)
        run: |
          python -m src.pipelines.pipeline_runner production_regularized

      - name: Validate End-to-End Pipeline (Edge Profile)
        run: |
          python -m src.pipelines.pipeline_runner edge_low_latency
