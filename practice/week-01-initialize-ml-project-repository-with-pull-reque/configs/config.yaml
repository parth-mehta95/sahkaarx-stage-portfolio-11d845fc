# ML Project Configuration Matrix

project:
  name: "ml-project-scaffold"
  version: "0.1.0"
  description: "Standardized ML Project Repository Scaffold"
  author: "ML Engineering Team"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_samples: 1000
  feature_count: 10
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  target_column: "target"

model:
  name: "RandomForestClassifier"
  type: "tabular_classifier"
  hyperparameters:
    n_estimators: 100
    max_depth: 8
    min_samples_split: 4
    min_samples_leaf: 2
    random_state: 42
    n_jobs: -1
  artifacts_dir: "models/checkpoints"
  model_filename: "model.joblib"
  metrics_filename: "metrics.json"

training:
  epochs: 10
  batch_size: 32
  early_stopping_patience: 3
  metrics_to_track:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"

evaluation:
  target_accuracy: 0.85
  target_f1: 0.80
  confusion_matrix_filename: "confusion_matrix.json"
